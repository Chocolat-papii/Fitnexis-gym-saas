<details class="panel commercial-panel" <%= typeof reauthCodeSent !== 'undefined' && reauthCodeSent ? 'open' : '' %>><summary>Confirm identity for sensitive changes</summary><% if(typeof reauthCodeSent !== 'undefined' && reauthCodeSent){ %><p role="status">Confirmation code sent. Check your email.</p><% } %><p class="muted">Your confirmation lasts five minutes. Request a code, then enter it with your password.</p>
<form method="post" action="/platform/reauthenticate/code"><input type="hidden" name="_csrf" value="<%= csrf %>"><button>Send confirmation code</button></form>
<form class="commercial-form" method="post" action="/platform/reauthenticate"><input type="hidden" name="_csrf" value="<%= csrf %>"><label>Password<input type="password" name="password" autocomplete="current-password" required></label><label>Email code<input name="code" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required></label><button class="primary">Confirm identity</button></form></details>
