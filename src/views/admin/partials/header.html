

<!-- Header -->
<div class="d-flex justify-content-between align-items-center px-3 glass-card rounded-bottom-4 header mb-4">

  <!-- Logo -->
  <button class="btn fw-bold fs-4 border-0" onclick="window.FitnexisLoading.start(this); goHome()">
    <%= gym.name %>
  </button>
  <!-- <h2 class="nav-brand"><a href="/"><img src="../assets/landing/images/icon/mfc-2.png" alt="Mash Fitness" style="height: 35px;"
                  class="img-fluid"></a></h2> -->

  <!-- Right -->
  <div class="d-flex align-items-center gap-2">

    <!-- Dark Mode -->
    <button id="themeToggle" class="btn icon-btn border" data-bs-toggle="tooltip" aria-label="Switch colour theme">
      <i id="themeIcon" class="bi bi-moon"></i>
    </button>

    <%- include('../../partials/notification-bell.html') %>

    <!-- Profile -->
    <div class="dropdown">
      <button class="btn p-0 border-0" data-bs-toggle="dropdown">
        <img src="<%= member.profile_picture || '/assets/brand/fitnexis-mark.svg' %>" class="rounded-circle" width="40" height="40">
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="/member/edit-profile"><span><i class="fa-solid fa-user"></i></span> <span>Profile</span></a></li>
        <!-- <li><a class="dropdown-item" href="#">Settings</a></li> -->
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" href="/logout"><span><i class="fa-solid fa-arrow-right-from-bracket"></i></span> <span>Logout</span></a></li>
      </ul>
    </div>

    <!-- Menu -->
    <button class="btn icon-btn d-lg-none" data-bs-toggle="tooltip" id="toggleSidebar" aria-label="Toggle navigation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

  </div>
</div>
 <script>
  function goHome() {
    window.location.href = "/home";
}
 </script>
