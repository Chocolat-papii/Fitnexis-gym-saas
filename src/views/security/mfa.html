<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check your email | Fitnexis</title><link rel="stylesheet" href="/assets/dashboard/css/platform.css"><link rel="stylesheet" href="/assets/dashboard/css/platform-brand.css"><link rel="stylesheet" href="/assets/dashboard/css/commercial.css"></head>
<body class="login-page"><main class="login-card">
<a href="/" class="fitnexis-brand"><img src="/assets/brand/fitnexis-mark.svg" alt="" width="39" height="34">FITNEXIS</a>
<p class="eyebrow">ACCOUNT SECURITY</p><h1>Check your email</h1>
<p class="muted">Enter the six-digit code sent to <%= email %>.</p>
<% if(error) { %><p class="error" role="alert"><%= error %></p><% } %>
<form method="post" action="/security/mfa/<%= scope %>"><input type="hidden" name="_csrf" value="<%= csrf %>"><label for="code">Email verification code</label><input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus><button class="primary" type="submit">Verify and continue</button></form>
<form method="post" action="/security/mfa/<%= scope %>/resend"><input type="hidden" name="_csrf" value="<%= csrf %>"><button type="submit">Send a new code</button></form>
<p class="footnote">Codes expire after five minutes and work once. Check your spam folder. Wait one minute before requesting another.</p>
<a href="<%= scope==='platform'?'/platform/login':'/login' %>">Back to sign in</a>
</main></body></html>
